[tool.poetry]
name = "assistant"
version = "0.1.0"
description = ""
authors = ["joaoflauzino"]
readme = "README.md"

[virtualenvs]
in-project = true

[tool.poetry.dependencies]
python = "^3.12"
python-telegram-bot = "^21.3"
fastapi = "^0.111.0"
sqlalchemy = "^2.0.30"
psycopg2-binary = "^2.9.9"
types-requests = "^2.32.0.20240602"
sqlalchemy-stubs = "^0.4"
langchain-ollama = "^0.2.2"
langchain = "^0.3.13"
langchain-community = "^0.3.13"
langchain-google-vertexai = "^2.0.9"
google-generativeai = "^0.8.5"

[tool.poetry.group.dev.dependencies]
ipython = "^8.25.0"
flake8 = "^7.0.0"
black = "^24.4.2"
bandit = "^1.7.8"
pre-commit = "^3.7.1"
mypy = "^1.10.0"
ruff = "^0.4.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4


target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.ruff.lint.isort]
known-first-party = ["app"]
force-single-line = false
combine-as-imports = true

[tool.taskipy.tasks]
lint = "ruff check --fix app/ && black app/"
imports = "ruff check --select I --fix app/"